<svg viewBox="0 0 900 460" width="900" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect width="900" height="460" fill="#fbfaf7"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" fill="#333333">بنية النموذج: من المدخلات إلى القرار</text>

  <!-- inputs -->
  <rect x="700" y="65" width="150" height="55" rx="8" fill="#eef2f7" stroke="#4b6b8a" stroke-width="2"/>
  <text x="775" y="98" text-anchor="middle" font-size="13" fill="#22344a">صورة نسيجية (WSI)</text>

  <rect x="700" y="140" width="150" height="55" rx="8" fill="#eef7f0" stroke="#4a8a5c" stroke-width="2"/>
  <text x="775" y="173" text-anchor="middle" font-size="13" fill="#22402a">تسلسل جيني</text>

  <rect x="700" y="215" width="150" height="55" rx="8" fill="#f7f0ee" stroke="#a1614c" stroke-width="2"/>
  <text x="775" y="248" text-anchor="middle" font-size="13" fill="#402a22">سجل سريري</text>

  <!-- encoders -->
  <path d="M700 92 L 560 92" stroke="#8a97a6" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="410" y="65" width="150" height="55" rx="8" fill="#e4ecf3" stroke="#4b6b8a" stroke-width="2"/>
  <text x="485" y="90" text-anchor="middle" font-size="12" fill="#22344a">مشفّر الصورة</text>
  <text x="485" y="108" text-anchor="middle" font-size="10" fill="#5b6b7a">Attention + CONCH</text>

  <path d="M700 167 L 560 167" stroke="#8a97a6" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="410" y="140" width="150" height="55" rx="8" fill="#e3f0e6" stroke="#4a8a5c" stroke-width="2"/>
  <text x="485" y="165" text-anchor="middle" font-size="12" fill="#22402a">مشفّر الجين</text>
  <text x="485" y="183" text-anchor="middle" font-size="10" fill="#5b7a63">اختيار + شبكة</text>

  <path d="M700 242 L 560 242" stroke="#8a97a6" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="410" y="215" width="150" height="55" rx="8" fill="#f0e3e0" stroke="#a1614c" stroke-width="2"/>
  <text x="485" y="240" text-anchor="middle" font-size="12" fill="#402a22">مشفّر السجل</text>
  <text x="485" y="258" text-anchor="middle" font-size="10" fill="#7a5b52">شبكة بسيطة</text>

  <!-- fusion -->
  <path d="M410 92 L 300 167" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M410 167 L 300 190" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M410 242 L 300 213" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#a3)"/>
  <rect x="180" y="150" width="120" height="90" rx="10" fill="#f3ecf9" stroke="#7a5ba6" stroke-width="2.5"/>
  <text x="240" y="185" text-anchor="middle" font-size="13" fill="#3a2a52">طبقة الدمج</text>
  <text x="240" y="205" text-anchor="middle" font-size="10" fill="#6b5a80">تمثيل موحّد</text>
  <text x="240" y="222" text-anchor="middle" font-size="10" fill="#6b5a80">للمريض</text>

  <!-- two heads -->
  <path d="M180 175 L 100 100" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M180 215 L 100 320" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="20" y="65" width="140" height="60" rx="8" fill="#fdf3e3" stroke="#b8862f" stroke-width="2"/>
  <text x="90" y="90" text-anchor="middle" font-size="12" fill="#5a3f10">تنبؤ بالبقاء</text>
  <text x="90" y="108" text-anchor="middle" font-size="10" fill="#8a6a2f">Cox Loss</text>

  <rect x="20" y="290" width="140" height="60" rx="8" fill="#fdf3e3" stroke="#b8862f" stroke-width="2"/>
  <text x="90" y="315" text-anchor="middle" font-size="12" fill="#5a3f10">تصنيف الخطورة</text>
  <text x="90" y="333" text-anchor="middle" font-size="10" fill="#8a6a2f">3 فئات (IPI)</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a97a6"/>
    </marker>
  </defs>
</svg>
