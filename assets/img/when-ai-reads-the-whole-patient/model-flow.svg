<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect width="900" height="420" fill="#fbfaf7"/>

  <!-- three source boxes on the right (reading starts right in Arabic) -->
  <rect x="700" y="40" width="160" height="80" rx="10" fill="#eef2f7" stroke="#4b6b8a" stroke-width="2"/>
  <text x="780" y="75" text-anchor="middle" font-size="18" fill="#22344a">صورة نسيجية</text>
  <text x="780" y="100" text-anchor="middle" font-size="13" fill="#5b6b7a">Image</text>

  <rect x="700" y="170" width="160" height="80" rx="10" fill="#eef7f0" stroke="#4a8a5c" stroke-width="2"/>
  <text x="780" y="205" text-anchor="middle" font-size="18" fill="#22402a">تسلسل جيني</text>
  <text x="780" y="230" text-anchor="middle" font-size="13" fill="#5b7a63">RNA-seq</text>

  <rect x="700" y="300" width="160" height="80" rx="10" fill="#f7f0ee" stroke="#a1614c" stroke-width="2"/>
  <text x="780" y="335" text-anchor="middle" font-size="18" fill="#402a22">سجل سريري</text>
  <text x="780" y="360" text-anchor="middle" font-size="13" fill="#7a5b52">Clinical Record</text>

  <!-- arrows into center box -->
  <path d="M700 80 L 520 190" stroke="#8a97a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M700 210 L 520 210" stroke="#8a97a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M700 340 L 520 230" stroke="#8a97a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- center fusion box -->
  <rect x="330" y="160" width="190" height="100" rx="12" fill="#f3ecf9" stroke="#7a5ba6" stroke-width="2.5"/>
  <text x="425" y="200" text-anchor="middle" font-size="18" fill="#3a2a52">النموذج الموحّد</text>
  <text x="425" y="225" text-anchor="middle" font-size="13" fill="#6b5a80">Multimodal Model</text>
  <text x="425" y="245" text-anchor="middle" font-size="13" fill="#6b5a80">(دمج الوسائط)</text>

  <!-- arrow to decision -->
  <path d="M330 210 L 170 210" stroke="#8a97a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- decision box -->
  <rect x="30" y="160" width="140" height="100" rx="12" fill="#fdf3e3" stroke="#b8862f" stroke-width="2.5"/>
  <text x="100" y="200" text-anchor="middle" font-size="17" fill="#5a3f10">قرار طبي</text>
  <text x="100" y="222" text-anchor="middle" font-size="12" fill="#8a6a2f">تنبؤ + تصنيف</text>
  <text x="100" y="242" text-anchor="middle" font-size="12" fill="#8a6a2f">+ توصية علاج</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a97a6"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="16" fill="#333333">من ثلاثة مصادر متفرقة إلى قرار طبي واحد</text>
</svg>
