<svg viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect width="900" height="380" fill="#fbfaf7"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" fill="#333333">مجموعتا البيانات المستخدمتان</text>

  <!-- right card: TCGA-DLBC -->
  <rect x="480" y="60" width="360" height="280" rx="14" fill="#f3ecf9" stroke="#7a5ba6" stroke-width="2"/>
  <text x="660" y="100" text-anchor="middle" font-size="18" fill="#3a2a52">TCGA-DLBC</text>
  <text x="660" y="140" text-anchor="middle" font-size="30" fill="#3a2a52" font-weight="bold">48</text>
  <text x="660" y="160" text-anchor="middle" font-size="13" fill="#6b5a80">مريضًا</text>

  <rect x="510" y="185" width="90" height="55" rx="8" fill="#eef2f7" stroke="#4b6b8a"/>
  <text x="555" y="217" text-anchor="middle" font-size="12" fill="#22344a">صورة</text>
  <rect x="610" y="185" width="90" height="55" rx="8" fill="#eef7f0" stroke="#4a8a5c"/>
  <text x="655" y="217" text-anchor="middle" font-size="12" fill="#22402a">جين</text>
  <rect x="710" y="185" width="90" height="55" rx="8" fill="#f7f0ee" stroke="#a1614c"/>
  <text x="755" y="217" text-anchor="middle" font-size="12" fill="#402a22">سريري</text>

  <text x="660" y="270" text-anchor="middle" font-size="12" fill="#6b5a80">الوسائط الثلاث متوفرة معًا</text>
  <text x="660" y="290" text-anchor="middle" font-size="12" fill="#b8862f" font-weight="bold">لكن 9 أحداث وفاة فقط</text>
  <text x="660" y="315" text-anchor="middle" font-size="11" fill="#8a97a6">مجموعة صغيرة وغنية</text>

  <!-- left card: DLBCL-Morph -->
  <rect x="60" y="60" width="360" height="280" rx="14" fill="#eef2f7" stroke="#4b6b8a" stroke-width="2"/>
  <text x="240" y="100" text-anchor="middle" font-size="18" fill="#22344a">DLBCL-Morph</text>
  <text x="240" y="140" text-anchor="middle" font-size="30" fill="#22344a" font-weight="bold">170</text>
  <text x="240" y="160" text-anchor="middle" font-size="13" fill="#5b6b7a">مريضًا (من أصل 209)</text>

  <rect x="140" y="185" width="90" height="55" rx="8" fill="#eef2f7" stroke="#4b6b8a"/>
  <text x="185" y="217" text-anchor="middle" font-size="12" fill="#22344a">صورة</text>
  <rect x="250" y="185" width="90" height="55" rx="8" fill="#f2f2f2" stroke="#999999" stroke-dasharray="4,3"/>
  <text x="295" y="217" text-anchor="middle" font-size="12" fill="#999999">لا جين</text>

  <text x="240" y="270" text-anchor="middle" font-size="12" fill="#5b6b7a">صور فقط، دون بيانات جينية</text>
  <text x="240" y="290" text-anchor="middle" font-size="12" fill="#4a8a5c" font-weight="bold">مجموعة أكبر حجمًا</text>
  <text x="240" y="315" text-anchor="middle" font-size="11" fill="#8a97a6">تُستخدم لاختبار الثبات</text>
</svg>
