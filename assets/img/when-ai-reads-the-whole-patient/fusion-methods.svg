<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif">
  <rect width="900" height="480" fill="#fbfaf7"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" fill="#333333">ثلاث طرق لدمج البيانات</text>

  <!-- COLUMN 1 : Early fusion (rightmost) -->
  <text x="770" y="70" text-anchor="middle" font-size="16" fill="#22344a">الدمج المبكر</text>
  <text x="770" y="90" text-anchor="middle" font-size="12" fill="#5b6b7a">Early Fusion</text>

  <rect x="710" y="110" width="30" height="30" fill="#eef2f7" stroke="#4b6b8a"/>
  <rect x="745" y="110" width="30" height="30" fill="#eef7f0" stroke="#4a8a5c"/>
  <rect x="780" y="110" width="30" height="30" fill="#f7f0ee" stroke="#a1614c"/>
  <path d="M760 140 L760 165" stroke="#8a97a6" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="710" y="170" width="100" height="50" rx="8" fill="#f3ecf9" stroke="#7a5ba6" stroke-width="2"/>
  <text x="760" y="200" text-anchor="middle" font-size="13" fill="#3a2a52">نموذج واحد</text>
  <path d="M760 220 L760 245" stroke="#8a97a6" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="720" y="250" width="80" height="35" rx="6" fill="#fdf3e3" stroke="#b8862f"/>
  <text x="760" y="273" text-anchor="middle" font-size="12" fill="#5a3f10">القرار</text>
  <text x="760" y="330" text-anchor="middle" font-size="11" fill="#5b6b7a">بيانات متجانسة</text>
  <text x="760" y="348" text-anchor="middle" font-size="11" fill="#5b6b7a">وكاملة لدى الجميع</text>

  <!-- COLUMN 2 : Intermediate fusion (middle) -->
  <text x="450" y="70" text-anchor="middle" font-size="16" fill="#22344a">الدمج الوسيط</text>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#5b6b7a">Intermediate Fusion</text>

  <rect x="390" y="110" width="30" height="30" fill="#eef2f7" stroke="#4b6b8a"/>
  <rect x="425" y="110" width="30" height="30" fill="#eef7f0" stroke="#4a8a5c"/>
  <rect x="460" y="110" width="30" height="30" fill="#f7f0ee" stroke="#a1614c"/>
  <path d="M405 140 L405 160" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M440 140 L440 160" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M475 140 L475 160" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="390" y="160" width="30" height="25" fill="#e4ecf3" stroke="#4b6b8a"/>
  <rect x="425" y="160" width="30" height="25" fill="#e3f0e6" stroke="#4a8a5c"/>
  <rect x="460" y="160" width="30" height="25" fill="#f0e3e0" stroke="#a1614c"/>
  <text x="440" y="200" text-anchor="middle" font-size="10" fill="#5b6b7a">مشفّر لكل وسيلة</text>
  <path d="M405 210 L 440 225" stroke="#8a97a6" stroke-width="1.5"/>
  <path d="M440 210 L 440 225" stroke="#8a97a6" stroke-width="1.5"/>
  <path d="M475 210 L 440 225" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="390" y="230" width="100" height="45" rx="8" fill="#f3ecf9" stroke="#7a5ba6" stroke-width="2"/>
  <text x="440" y="258" text-anchor="middle" font-size="12" fill="#3a2a52">دمج + قرار</text>
  <path d="M440 275 L440 295" stroke="#8a97a6" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="400" y="298" width="80" height="35" rx="6" fill="#fdf3e3" stroke="#b8862f"/>
  <text x="440" y="321" text-anchor="middle" font-size="12" fill="#5a3f10">القرار</text>
  <text x="440" y="360" text-anchor="middle" font-size="11" fill="#5b6b7a">وسائط مختلفة جذريًا</text>
  <text x="440" y="378" text-anchor="middle" font-size="11" fill="#5b6b7a">(صورة + جين + جدول)</text>

  <!-- COLUMN 3 : Late fusion (leftmost) -->
  <text x="130" y="70" text-anchor="middle" font-size="16" fill="#22344a">الدمج المتأخر</text>
  <text x="130" y="90" text-anchor="middle" font-size="12" fill="#5b6b7a">Late Fusion</text>

  <rect x="70" y="110" width="30" height="30" fill="#eef2f7" stroke="#4b6b8a"/>
  <rect x="105" y="110" width="30" height="30" fill="#eef7f0" stroke="#4a8a5c"/>
  <rect x="140" y="110" width="30" height="30" fill="#f7f0ee" stroke="#a1614c"/>
  <path d="M85 140 L85 165" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M120 140 L120 165" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M155 140 L155 165" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="65" y="170" width="40" height="45" rx="6" fill="#e4ecf3" stroke="#4b6b8a"/>
  <text x="85" y="195" text-anchor="middle" font-size="9" fill="#22344a">نموذج</text>
  <rect x="100" y="170" width="40" height="45" rx="6" fill="#e3f0e6" stroke="#4a8a5c"/>
  <text x="120" y="195" text-anchor="middle" font-size="9" fill="#22402a">نموذج</text>
  <rect x="135" y="170" width="40" height="45" rx="6" fill="#f0e3e0" stroke="#a1614c"/>
  <text x="155" y="195" text-anchor="middle" font-size="9" fill="#402a22">نموذج</text>
  <path d="M85 215 L 120 240" stroke="#8a97a6" stroke-width="1.5"/>
  <path d="M120 215 L 120 240" stroke="#8a97a6" stroke-width="1.5"/>
  <path d="M155 215 L 120 240" stroke="#8a97a6" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="80" y="243" width="80" height="35" rx="6" fill="#fdf3e3" stroke="#b8862f"/>
  <text x="120" y="266" text-anchor="middle" font-size="11" fill="#5a3f10">تجميع القرارات</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#5b6b7a">قد تغيب إحدى</text>
  <text x="120" y="348" text-anchor="middle" font-size="11" fill="#5b6b7a">الوسائط أحيانًا</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#8a97a6"/>
    </marker>
  </defs>
</svg>
